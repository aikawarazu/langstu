<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pp">
    <div class="pp-h">📚 NCE 学习助手</div>
    <div class="pp-sub">在线阅读时即点即译，侧栏展开音频精听与教材讲解</div>

    <button class="pp-btn" id="ppRandom">🎲 随机一课</button>
    <div class="pp-sep"></div>
    <div class="pp-bar">
      <input id="ppQ" class="pp-input" placeholder="查单词 / 短语" autocomplete="off">
      <button class="pp-go" id="ppGo">查找</button>
    </div>
    <div class="pp-tip">提示：在任意网页双击英文单词，即可浮出释义。</div>
  </div>
  <script src="popup.js"></script>
