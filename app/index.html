<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>新概念英语点读 · 学习</title>
<meta name="description" content="纯静态英语教材点读学习站：课文逐句点读、音频精听 A-B 复读、教材笔记、跨课笔记总览，支持离线使用。">
<meta name="theme-color" content="#4353ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="点读学习">
<link rel="stylesheet" href="css/app.css?v=59">
<link rel="stylesheet" href="css/v12.css?v=59">
<link rel="stylesheet" href="css/textbook.css?v=59">
<link rel="stylesheet" href="css/split.css?v=59">
<link rel="stylesheet" href="css/library.css?v=59">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">学</div>
    <span class="sel booksel"><select id="bookSel"></select></span>
    <!-- 切课：上一课 / 教材目录（显示当前课名）/ 下一课，夹住目录按钮 -->
    <div class="topnav">
      <button class="unbtn" id="tPrev" title="上一课">‹ 上一课</button>
      <div class="dir-wrap">
        <button class="dir-btn" id="dirBtn" aria-haspopup="dialog" aria-expanded="false">📚 教材目录 <i class="caret">▾</i></button>
        <div class="dir-pop" id="dirPop" role="dialog" aria-label="教材目录" hidden>
          <div class="dir-top">
            <div>
              <div class="dir-t">教材目录</div>
              <div class="dir-sub" id="dirSub"></div>
            </div>
            <button class="dir-x" id="dirX" title="关闭目录">✕</button>
          </div>
          <div class="dir-search">
            <input id="dirSearch" type="text" placeholder="搜课号或标题，如 24 / handbag" autocomplete="off">
            <span id="dirCount"></span>
          </div>
          <div class="dir-list" id="dirList"></div>
          <div class="dir-foot">
            <button class="dir-act" id="dirNow">定位当前课</button>
            <button class="dir-act danger" id="dirDel" style="display:none">删除本课程包</button>
            <span class="mut sm" id="dirTip">✓ 表示已学完</span>
          </div>
        </div>
      </div>
      <button class="unbtn" id="tNext" title="下一课">下一课 ›</button>
    </div>
    <!-- 顶栏工具组：视图切换 + 课程管理，共用一个分段控件 -->
    <div class="viewsw">
      <button class="vwbtn on" id="vwStudy">📖 学习</button>
      <button class="vwbtn" id="vwNotes">🗂 笔记总览</button>
      <button class="vwbtn imp" id="libBtn" title="课程管理：导入 / 导出 / 资源网站 / 我的知识">📚 课程管理</button>
    </div>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <!-- 状态区（整行独占）：左侧＝本单元信息，右侧＝单元操作 -->
    <div class="statusbar" id="statusbar">
      <span class="sb-item"><i class="sb-dot" id="stDot"></i><span id="stLesson">未学</span></span>
      <i class="sb-sep"></i>
      <span id="stNums"></span>
      <i class="sb-sep"></i>
      <span id="stVer"></span>
      <i class="sb-sep"></i>
      <span class="sb-book" id="stBook"></span>
      <i class="sb-sep"></i>
      <span class="sb-prog" id="stProg"></span>
      <span class="meta-acts" id="metaActs"></span>
    </div>
  </div>
  <div class="stage">
    <main class="main">
      <!-- 学习页：左＝音频/视频，右＝教材/学习笔记 -->
      <div id="study"></div>
      <!-- 笔记总览页：跨课汇总 -->
      <div id="overview" hidden></div>
    </main>
  </div>
</div>
<div class="wpop" id="wpop" hidden></div>

<!-- 教材纯文本查看浮框 -->
<div class="nmodal" id="textModal" hidden>
  <div class="nm-mask" id="txMask"></div>
  <div class="nm-box" role="dialog" aria-modal="true" aria-label="教材纯文本">
    <div class="nm-head">
      <div><div class="t">📄 教材纯文本</div><div class="s" id="txSub"></div></div>
      <button class="nm-x" id="txX" title="关闭">✕</button>
    </div>
    <pre id="txPre" class="tx-pre"></pre>
    <div class="nm-foot">
      <span class="st">可自由选取复制；手机长按全选</span>
      <span class="sp"></span>
      <button class="nm-btn" id="txCopy">📋 复制全文</button>
      <button class="nm-btn" id="txExport">⬇️ 导出 txt</button>
      <button class="nm-btn ok" id="txDone">完成</button>
    </div>
  </div>
</div>

<!-- 记笔记：弹出浮框 -->
<div class="nmodal" id="noteModal" hidden>
  <div class="nm-mask" id="nmMask"></div>
  <div class="nm-box" role="dialog" aria-modal="true" aria-label="我的笔记">
    <div class="nm-head">
      <div><div class="t">📝 我的笔记</div><div class="s" id="nmSub"></div></div>
      <button class="nm-x" id="nmX" title="关闭">✕</button>
    </div>
    <textarea id="nmText" placeholder="记下本课自己的心得：易错点、想造句的句子、听不出来的连读…"></textarea>
    <div class="nm-foot">
      <span class="st" id="nmSt">自动保存到本机</span>
      <span class="sp"></span>
      <button class="nm-btn" id="nmClear">清空</button>
      <button class="nm-btn ok" id="nmDone">完成</button>
    </div>
  </div>
</div>

<!-- 生词本：收藏浮框 -->
<div class="nmodal" id="vocabModal" hidden>
  <div class="nm-mask" id="vxMask"></div>
  <div class="nm-box" role="dialog" aria-modal="true" aria-label="生词本">
    <div class="nm-head">
      <div><div class="t">⭐ 生词本 <span class="mut" id="vocabCount"></span></div>
        <div class="s">点单词可再次查看详情，✕ 移出收藏</div></div>
      <button class="nm-x" id="vxX" title="关闭">✕</button>
    </div>
    <div class="vocab-list" id="vocabList"></div>
    <div class="nm-foot">
      <span class="st">收藏存于本机</span>
      <span class="sp"></span>
      <button class="nm-btn ok" id="vxDone">完成</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>
<div id="toast"></div>
<script src="js/data/store.js?v=59"></script>
<script src="js/data/registry.js?v=59"></script>
<script src="js/data/cache.js?v=59"></script>
<script src="js/zip.js?v=59"></script>
<script src="js/data/prompt.js?v=59"></script>
<script src="js/app.js?v=59"></script>
<script src="js/library.js?v=59"></script>
<script src="js/pwa.js?v=59"></script>
</body>
</html>
